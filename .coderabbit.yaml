# CodeRabbit - Revue automatisée M-Sec Technology Consulting
early_access: false
resolve_conversation_comments: true
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base: main
  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Astro / TypeScript. Vérifiez :
        - Pas de clé API en dur (Stripe, SideShift, Supabase)
        - Validation des inputs côté serveur
        - Webhook signature verification (Stripe)
    - path: "**/*.astro"
      instructions: |
        Composants Astro. Accessibilité WCAG 2.1 AA requise.
        Pas de secrets exposés côté client.
chat:
  auto_reply: true
tools:
  eslint:
    enabled: true
