# .github/workflows/secrets-scan.yml
# Scan de fuites de secrets — ZÉRO SECRET dans le dépôt M-SEC.
# S'exécute sur chaque push et chaque pull request :
#  - Gitleaks (moteur éprouvé, règles par défaut + règles M-SEC personnalisées)
#  - Bloque le workflow (et donc le déploiement) si un secret est détecté
name: Scan de secrets

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet nécessaire pour détecter un secret ajouté
          # puis supprimé dans un commit antérieur.
          fetch-depth: 0

      - name: Gitleaks (historique complet)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Faire échouer le job dès qu'un secret est trouvé
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "true"

  # Vérification ciblée : aucun fichier .env jamais suivi, ni clés/tokens
  # dans le contenu versionné (syntaxe simple, indépendante de Gitleaks).
  hardguard:
    name: Garde-fous M-SEC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aucun .env suivi
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.env)$'; then
            echo "::error::Un fichier .env est suivi par Git. Supprimez-le (git rm --cached) et ajoutez-le au .gitignore."
            exit 1
          fi
          echo "OK : aucun .env suivi."

      - name: Aucune clé/secret évident dans le contenu
        run: |
          if grep -RInE \
            '(sk-(live|test)-[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35})' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Clé API / clé privée détectée dans le contenu versionné."
            exit 1
          fi
          echo "OK : aucun secret évident."
